<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — OraSocial</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1A1410;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 3.5rem 3rem;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
    }
    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: #FAF7F2;
      margin-bottom: 1rem;
    }
    .sub {
      font-size: 0.95rem;
      color: rgba(250,247,242,0.55);
      line-height: 1.75;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #C4704A;
      color: white;
      text-decoration: none;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: rgba(250,247,242,0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1 class="title">Thank you for reaching out!</h1>
    <p class="sub">Your inquiry has been received. I'll get back to you within <strong style="color:#FAF7F2;">24 hours</strong> to discuss how we can grow your brand together.</p>
    <a href="https://orasocial.github.io" class="btn">← Back to homepage</a>
    <p class="footer-note">— Mary, OraSocial</p>
  </div>
</body>
</html>
